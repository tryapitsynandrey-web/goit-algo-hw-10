[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "goit-algo-hw-10"
version = "0.1.0"
description = "HW 10: Greedy Algorithms and DP, Monte Carlo"
authors = [
    {name = "Student"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
pythonpath = [
  "."
]

[tool.pyright]
include = ["src", "tests", "config"]
extraPaths = ["."]
executionEnvironments = [
  { root = "." }
]


[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["scipy", "scipy.*"]
ignore_missing_imports = true

[tool.pyrefly]
project-includes = [
    "config/**/*.py",
    "src/**/*.py",
    "tests/**/*.py",
]
project-excludes = [
    ".venv/**",
    ".agents/**",
    ".git/**",
    "**/__pycache__/**",
    "**/*.egg-info/**",
]
search-path = [
    ".",
    "src",
]
python-version = "3.12"
